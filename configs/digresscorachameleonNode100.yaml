# DiGress Minimal Configuration for CoraChameleon Dataset

general:
  name: 'DiGressNode100Constant'  # Name of the experiment/configuration
  seed: 42
  check_val_every_n_epochs: 10
  sample_every_val: 10
  number_chain_steps: 500
  samples_to_generate: 100
  chains_to_save: 1
  final_model_samples_to_generate: 100
  final_model_samples_to_save: 100

dataset:
  name: 'corachameleon'
  datadir: 'data/CoraChameleon/'
  
  # CoraChameleon specific settings
  node_size: 100  # Options: 10, 30, 40, 50, 500
  split_type: 'S1'  # Options: 'S1' or 'S2'
  num_train_graphs: 3000  # How many graphs to use for training (max 3000)
  
  # Single graph mode for overfitting test
  single_graph: false  #§Set to true for single-graph overfitting test
  single_graph_idx: 0   # Which graph to use when single_graph=true

model:
  # Architecture
  n_layers: 6
  hidden_dims:
    dx: 256
    de: 64
    dy: 64
    n_head: 8
    dim_ffX: 256
    dim_ffE: 64
    dim_ffY: 256
  hidden_mlp_dims:
    X: 128
    E: 64
    y: 128
  
  # Diffusion
  diffusion_steps: 500
  diffusion_noise_schedule: 'cosine'
  transition: 'marginal'  # uniform or marginal
  
  # Extra features
  extra_features: 'none'  # all or none
  
  # Loss
  lambda_train:
    - 5.0  # X
    - 0.0  # E  
    - 0.0  # y

train:
  n_epochs: 5000
  batch_size: 32
  lr: 0.0001
  weight_decay: 0.00012
  log_every_steps: 100
  save_every_epochs: 100
